version: '3.9'
services:
  backend:
    image: eclipse-temurin:17-jdk
    working_dir: /app
    volumes:
      - ./backend:/app
    command: bash -lc "./mvnw spring-boot:run"
    ports:
      - "8080:8080"

  frontend:
    image: node:20
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: bash -lc "npm install && npm start -- --host 0.0.0.0 --port 4200"
    ports:
      - "4200:4200"
    depends_on:
      - backend
